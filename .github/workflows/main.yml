on: push
name: Build and deploy Zola Pages
jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: build_and_deploy
        # Pinned: @master now ships Zola 0.23, which removed Tera macros and shortcodes and breaks this site's templates. Unpin once migrated.
        uses: shalzz/zola-deploy-action@v0.22.1
        env:
          # Target branch
          PAGES_BRANCH: deploy
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
