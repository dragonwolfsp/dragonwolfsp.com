
{% extends "base.html" %}

{% block title %}
{% set_global title = "Genres" %}
<title>Genres</title>
{% endblock title %}


{% block content %}
<section class="genre-list">
  <h1>Genres</h1>
  <ul>
    {% for term in terms %}
    <li>
      <a href="{{ term.permalink }}">{{ term.name }}</a>
      ({{ term.pages | length }})
    </li>
    {% endfor %}
  </ul>
</section>
{% endblock content %}
